services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ─── Production SMTP (outbound-only Postfix + DKIM) ──────────────────────────
  # Handles actual email delivery. Requires DNS setup — see README.
  # After first start, run:
  #   docker compose exec smtp cat /etc/opendkim/keys/<MAIL_DOMAIN>/mail.txt
  # and publish the printed TXT record in your domain's DNS.
  smtp:
    image: boky/postfix
    hostname: ${MAIL_HOSTNAME:?Set MAIL_HOSTNAME in .env (e.g. mail.yourdomain.com)}
    environment:
      HOSTNAME: ${MAIL_HOSTNAME}
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:?Set MAIL_DOMAIN in .env (e.g. yourdomain.com)}
      DKIM_AUTOGENERATE: 1
      LOG_SUBJECT: 1
    volumes:
      - dkim_keys:/etc/opendkim/keys
    restart: unless-stopped

  # ─── Dev-only SMTP catcher (Mailpit) ─────────────────────────────────────────
  # Captures all outgoing emails — nothing actually leaves the machine.
  # Web UI: http://localhost:8025
  # Start with: docker compose --profile dev up
  mailpit:
    profiles: [dev]
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: sh -c "(npx prisma migrate deploy || npx prisma db push) && npm start"
    ports:
      - "3101:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://graphrag:graphrag@db:5432/postgres?schema=public}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3100}
      # SMTP — defaults to the smtp service above.
      # For local dev with Mailpit, override: SMTP_HOST=mailpit SMTP_PORT=1025
      - SMTP_HOST=${SMTP_HOST:-smtp}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@${MAIL_DOMAIN:-localhost}}
    depends_on:
      - db
      - smtp

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "3100:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  dkim_keys:
